name: adaceylan-logo
on:
  push:
    branches: [main]
    paths: ['adaceylan/logolar.json', '.github/workflows/adaceylan-logo.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p adaceylan/_logo
          python3 - <<'P'
          import json,urllib.request
          for k,u in json.load(open('adaceylan/logolar.json')).items():
              try:
                  d=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=60).read()
                  open('adaceylan/_logo/'+k,'wb').write(d); print('ok',k,len(d))
              except Exception as e: print('ERR',k,e)
          P
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add adaceylan/_logo && (git diff --cached --quiet || (git commit -m "adaceylan: marka logoları" && git push))
